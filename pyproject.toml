[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "euroleague-fantasy-manager"
version = "1.0.1"
description = "A deterministic, local-first EuroLeague (and EuroCup) Fantasy Challenge decision engine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "marcomessina25" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.6",
]

[project.scripts]
elf = "euroleague_fantasy_manager.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tests"]
addopts = "-q -m \"not perf and not realdata\""
markers = [
    "perf: performance benchmark tests",
    "realdata: tests requiring local real data database",
]

[tool.hatch.build.targets.wheel]
packages = ["src/euroleague_fantasy_manager"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E9"]
